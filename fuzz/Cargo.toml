[package]
name = "wim-fuzz"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[dependencies]
honggfuzz = "0.5"
wim-format = { version = "0.1.0", path = "../crates/wim-format" }

[profile.release]
debug = 1
overflow-checks = true

[lints.clippy]
# Preserve established iterator/remainder handling during the Rust 1.99 upgrade.
chunks_exact_to_as_chunks = "allow"
